name: Démarrer l'exercice

on:
  workflow_call:
    inputs:
      exercise-title:
        description: "Titre de l'exercice"
        required: true
        type: string
      issue-title-prefix:
        description: "Préfixe du titre de l'Issue de l'exercice"
        required: false
        type: string
        default: "Exercice : "
      intro-message:
        description: "Message d'introduction de l'exercice"
        required: true
        type: string
      manage-workflows:
        description: "Désactiver les workflows numérotés après initialisation"
        required: false
        type: boolean
        default: false
    outputs:
      issue-url:
        description: "URL de l'Issue créée"
        value: ${{ jobs.create_exercise.outputs.issue-url }}
      issue-number:
        description: "Numéro de l'Issue créée"
        value: ${{ jobs.create_exercise.outputs.issue-number }}

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  create_exercise:
    name: Créer l'Issue de l'exercice
    runs-on: ubuntu-latest
    outputs:
      issue-url: ${{ steps.create-issue.outputs.ISSUE_URL }}
      issue-number: ${{ steps.create-issue.outputs.ISSUE_NUMBER }}
    steps:
      - name: Récupérer les templates français
        uses: actions/checkout@v4
        with:
          repository: ENSTASIMOV/exercise-toolkit-fr
          path: exercise-toolkit-fr
          ref: main

      - name: Construire le message d'accueil
        id: build-issue-description
        uses: skills/action-text-variables@v3
        with:
          template-file: exercise-toolkit-fr/markdown-templates/step-feedback/welcome.md
          template-vars: |
            title: "${{ inputs.exercise-title }}"
            login: "${{ github.actor }}"
            intro_message: "${{ inputs.intro-message }}"

      - name: Créer l'Issue de l'exercice
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${process.env.ISSUE_TITLE_PREFIX}${process.env.EXERCISE_TITLE}`,
              body: process.env.ISSUE_BODY
            });
            core.setOutput('ISSUE_URL', issue.html_url);
            core.setOutput('ISSUE_NUMBER', issue.number);
        env:
          ISSUE_BODY: ${{ steps.build-issue-description.outputs.updated-text }}
          EXERCISE_TITLE: ${{ inputs.exercise-title }}
          ISSUE_TITLE_PREFIX: ${{ inputs.issue-title-prefix }}

  update_readme:
    name: Mettre à jour le README
    runs-on: ubuntu-latest
    needs: create_exercise
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les templates français
        uses: actions/checkout@v4
        with:
          repository: ENSTASIMOV/exercise-toolkit-fr
          path: exercise-toolkit-fr
          ref: main

      - name: Rendre absolues les images des étapes
        uses: actions/github-script@v7
        env:
          COURSE_REPOSITORY: ${{ github.repository }}
          COURSE_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const stepsDir = ".github/steps";
            if (!fs.existsSync(stepsDir)) {
              core.info("Aucun dossier .github/steps à traiter.");
              return;
            }

            for (const entry of fs.readdirSync(stepsDir)) {
              if (!entry.endsWith(".md")) continue;

              const file = path.join(stepsDir, entry);
              const before = fs.readFileSync(file, "utf8");
              const after = before.replace(
                /\.\.\/\.\.\/images\/([^\s)"']+)/g,
                (_, imageName) =>
                  `https://github.com/${process.env.COURSE_REPOSITORY}/blob/${process.env.COURSE_BRANCH}/images/${imageName}?raw=true`
              );

              if (after !== before) {
                fs.writeFileSync(file, after, "utf8");
                core.info(`Images rendues absolues dans ${file}`);
              }
            }

      - name: Construire le README de démarrage
        id: build-new-readme
        uses: skills/action-text-variables@v3
        with:
          template-file: exercise-toolkit-fr/markdown-templates/readme/exercise-started.md
          template-vars: |
            title: "${{ inputs.exercise-title }}"
            login: "${{ github.actor }}"
            issue_url: "${{ needs.create_exercise.outputs.issue-url }}"

      - name: Écrire le README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Enregistrer le README
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md .github/steps/*.md"
          message: "Démarrer l'exercice"
          default_author: github_actions

  disable_workflows:
    name: Désactiver les workflows de l'exercice
    if: inputs.manage-workflows
    needs: update_readme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Désactiver les workflows numérotés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          workflows=$(git ls-files | grep -E '^\.github/workflows/[1-9][0-9]*.*\.(yml|yaml)$' || true)

          for workflow in $workflows; do
            workflow_name="$(basename "$workflow")"
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_name}" --jq '.state' 2>/dev/null || true)"

            if [ "$state" = "active" ]; then
              echo "Désactivation : $workflow_name"
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_name}/disable"
            else
              echo "$workflow_name déjà désactivé ou indisponible ($state)"
            fi
          done
