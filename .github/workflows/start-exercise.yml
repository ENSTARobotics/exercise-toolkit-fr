name: Démarrer l'exercice

on:
  workflow_call:
    inputs:
      exercise-title:
        description: "Titre de l'exercice"
        required: true
        type: string
      issue-title-prefix:
        description: "Préfixe du titre de l'Issue de l'exercice"
        required: false
        type: string
        default: "Exercice : "
      intro-message:
        description: "Message d'introduction de l'exercice"
        required: true
        type: string
    outputs:
      issue-url:
        description: "URL de l'Issue créée"
        value: ${{ jobs.create_exercise.outputs.issue-url }}
      issue-number:
        description: "Numéro de l'Issue créée"
        value: ${{ jobs.create_exercise.outputs.issue-number }}

permissions:
  contents: write
  actions: write
  issues: write

env:
  TOOLKIT_REPOSITORY: ENSTASIMOV/exercise-toolkit-fr
  TOOLKIT_REF: main

jobs:
  disable_workflows:
    name: Désactiver les workflows de l'exercice
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Désactiver les workflows numérotés
        run: |
          workflows=$(git ls-files | grep -E '^\.github/workflows/[0-9].*\.(yml|yaml)$')
          for workflow in $workflows; do
            workflow_name="$(basename "$workflow")"
            echo "Désactivation : $workflow_name"
            gh workflow disable "$workflow_name" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create_exercise:
    name: Créer l'Issue et préparer le README
    runs-on: ubuntu-latest

    outputs:
      issue-url: ${{ steps.create-issue.outputs.ISSUE_URL }}
      issue-number: ${{ steps.create-issue.outputs.ISSUE_NUMBER }}

    steps:
      - name: Récupérer le dépôt de l'exercice
        uses: actions/checkout@v6

      - name: Récupérer les templates français
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TOOLKIT_REPOSITORY }}
          path: exercise-toolkit-fr
          ref: ${{ env.TOOLKIT_REF }}

      - name: Identifier le dépôt template
        id: get-template-repo
        uses: actions/github-script@v9
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            if (repo.template_repository) {
              console.log(`Dépôt template : ${repo.template_repository.full_name}`);
              const issueReportUrl = `https://github.com/${repo.template_repository.full_name}/issues`;
              core.setOutput('ISSUE_REPORT_URL', issueReportUrl);
              core.setOutput('TEMPLATE_REPOSITORY', repo.template_repository.full_name);
            } else {
              console.log('Aucun dépôt template associé.');
            }

      - name: Rendre absolues les images des étapes
        uses: actions/github-script@v9
        env:
          STEP_FILES_GLOB: .github/steps/*.md
        with:
          script: |
            const fs = require('fs');

            const globber = await glob.create(process.env.STEP_FILES_GLOB);
            const files = await globber.glob();

            files.forEach(file => {
              const content = fs.readFileSync(file, 'utf8');
              const updatedContent = content.replace(
                /\.\.\/images\/([^\s)"']+)/g,
                'https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/images/$1?raw=true'
              );

              if (content !== updatedContent) {
                fs.writeFileSync(file, updatedContent, 'utf8');
              }
            });

      - name: Construire le message d'accueil
        id: build-issue-description
        uses: skills/action-text-variables@v4
        with:
          template-file: exercise-toolkit-fr/markdown-templates/step-feedback/welcome.md
          template-vars: |
            title: ${{ inputs.exercise-title }}
            login: ${{ github.actor }}
            intro_message: ${{ inputs.intro-message }}
            bug_report_url: ${{ steps.get-template-repo.outputs.ISSUE_REPORT_URL || '' }}

      - name: Créer l'Issue de l'exercice
        id: create-issue
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${process.env.ISSUE_TITLE_PREFIX}${process.env.EXERCISE_TITLE}`,
              body: process.env.ISSUE_BODY
            });
            core.setOutput('ISSUE_URL', issue.html_url);
            core.setOutput('ISSUE_NUMBER', issue.number);
        env:
          ISSUE_BODY: ${{ steps.build-issue-description.outputs.updated-text }}
          EXERCISE_TITLE: ${{ inputs.exercise-title }}
          ISSUE_TITLE_PREFIX: ${{ inputs.issue-title-prefix }}

      - name: Construire le README de démarrage
        id: build-new-readme
        uses: skills/action-text-variables@v4
        with:
          template-file: exercise-toolkit-fr/markdown-templates/readme/exercise-started.md
          template-vars: |
            title: ${{ inputs.exercise-title }}
            login: ${{ github.actor }}
            issue_url: ${{ steps.create-issue.outputs.ISSUE_URL }}

      - name: Mettre à jour le README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Enregistrer la préparation de l'exercice
        uses: EndBug/add-and-commit@v10
        with:
          add: "README.md .github/steps/*.md"
          message: "Démarrer l'exercice"
          default_author: github_actions
