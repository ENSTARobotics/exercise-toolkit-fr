name: Démarrer l'exercice

on:
  workflow_call:
    inputs:
      exercise-title:
        description: "Titre de l'exercice"
        required: true
        type: string
      issue-title-prefix:
        description: "Préfixe du titre de l'Issue de l'exercice"
        required: false
        type: string
        default: "Exercice : "
      intro-message:
        description: "Message d'introduction de l'exercice"
        required: true
        type: string
      manage-workflows:
        description: "Désactiver les workflows d'étapes pendant l'initialisation"
        required: false
        type: boolean
        default: true
    outputs:
      issue-url:
        description: "URL de l'Issue créée"
        value: ${{ jobs.create_exercise.outputs.issue-url }}
      issue-number:
        description: "Numéro de l'Issue créée"
        value: ${{ jobs.create_exercise.outputs.issue-number }}

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  create_exercise:
    name: Préparer l'exercice
    runs-on: ubuntu-latest

    outputs:
      issue-url: ${{ steps.create-issue.outputs.ISSUE_URL }}
      issue-number: ${{ steps.create-issue.outputs.ISSUE_NUMBER }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Récupérer les templates français
        uses: actions/checkout@v6
        with:
          repository: ENSTARobotics/exercise-toolkit-fr
          path: exercise-toolkit-fr
          ref: main

      - name: Retrouver le dépôt template
        id: get-template-repo
        uses: actions/github-script@v8
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            if (repo.template_repository) {
              core.info(`Template : ${repo.template_repository.full_name}`);
              core.setOutput(
                "ISSUE_REPORT_URL",
                `https://github.com/${repo.template_repository.full_name}/issues`
              );
            } else {
              core.info("Aucun dépôt template associé n'a été détecté.");
              core.setOutput("ISSUE_REPORT_URL", "");
            }

      - name: Rendre les images des étapes accessibles depuis les commentaires
        uses: actions/github-script@v8
        env:
          STEP_FILES_GLOB: .github/steps/*.md
        with:
          script: |
            const fs = require("fs");

            const globber = await glob.create(process.env.STEP_FILES_GLOB);
            const files = await globber.glob();

            for (const file of files) {
              const before = fs.readFileSync(file, "utf8");
              const after = before.replace(
                /\.\.\/images\/([^\s)"']+)/g,
                "https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/images/$1?raw=true"
              );

              if (after !== before) {
                fs.writeFileSync(file, after, "utf8");
                core.info(`Images rendues absolues dans ${file}`);
              }
            }

      - name: Construire le message d'accueil
        id: build-issue-description
        uses: skills/action-text-variables@v3
        with:
          template-file: exercise-toolkit-fr/markdown-templates/step-feedback/welcome.md
          template-vars: >-
            {
              "title": ${{ toJSON(inputs.exercise-title) }},
              "login": ${{ toJSON(github.actor) }},
              "intro_message": ${{ toJSON(inputs.intro-message) }},
              "bug_report_url": ${{ toJSON(steps.get-template-repo.outputs.ISSUE_REPORT_URL || '') }}
            }

      - name: Créer l'Issue de l'exercice
        id: create-issue
        uses: actions/github-script@v8
        env:
          ISSUE_BODY: ${{ steps.build-issue-description.outputs.updated-text }}
          EXERCISE_TITLE: ${{ inputs.exercise-title }}
          ISSUE_TITLE_PREFIX: ${{ inputs.issue-title-prefix }}
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${process.env.ISSUE_TITLE_PREFIX}${process.env.EXERCISE_TITLE}`,
              body: process.env.ISSUE_BODY
            });

            core.setOutput("ISSUE_URL", issue.html_url);
            core.setOutput("ISSUE_NUMBER", issue.number);

      - name: Construire le README de démarrage
        id: build-new-readme
        uses: skills/action-text-variables@v3
        with:
          template-file: exercise-toolkit-fr/markdown-templates/readme/exercise-started.md
          template-vars: >-
            {
              "title": ${{ toJSON(inputs.exercise-title) }},
              "login": ${{ toJSON(github.actor) }},
              "issue_url": ${{ toJSON(steps.create-issue.outputs.ISSUE_URL) }}
            }

      - name: Écrire le README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: printf '%s\n' "$README_TEXT" > README.md

      - name: Enregistrer l'initialisation
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md .github/steps/*.md"
          message: "Démarrer l'exercice"
          default_author: github_actions

  disable_workflows:
    name: Mettre les étapes en attente
    if: inputs.manage-workflows
    needs: create_exercise
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Désactiver les workflows des étapes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          workflows=$(git ls-files | grep -E '^\.github/workflows/[1-9][0-9]*.*\.(yml|yaml)$' || true)

          for workflow in $workflows; do
            workflow_name="$(basename "$workflow")"
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_name}" --jq '.state' 2>/dev/null || true)"

            if [ "$state" = "active" ]; then
              echo "Désactivation : $workflow_name"
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_name}/disable"
            else
              echo "$workflow_name déjà désactivé ou indisponible ($state)"
            fi
          done
