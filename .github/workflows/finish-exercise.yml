name: Terminer l'exercice

on:
  workflow_call:
    inputs:
      issue-url:
        description: "URL de l'Issue à mettre à jour et fermer"
        required: true
        type: string
      exercise-title:
        description: "Titre de l'exercice"
        required: false
        type: string
      update-readme-with-congratulations:
        description: "Mettre à jour le README avec le message de félicitations"
        required: false
        type: boolean
        default: true
      target-branch:
        description: "Branche sur laquelle écrire le README final. Vide = branche par défaut du dépôt."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  update_readme:
    name: Mettre à jour le README final
    runs-on: ubuntu-latest
    if: inputs.update-readme-with-congratulations

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target-branch || github.event.repository.default_branch }}

      - name: Récupérer les templates français
        uses: actions/checkout@v4
        with:
          repository: ENSTASIMOV/exercise-toolkit-fr
          path: exercise-toolkit-fr
          ref: main

      - name: Construire le message de félicitations
        id: build-new-readme
        uses: skills/action-text-variables@v3
        with:
          template-file: exercise-toolkit-fr/markdown-templates/readme/exercise-finished.md
          template-vars: |
            login: "${{ github.actor }}"
            issue_url: "${{ inputs.issue-url }}"
            exercise_title: "${{ inputs.exercise-title }}"
            repository_url: "https://github.com/${{ github.repository }}"

      - name: Écrire le README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Enregistrer le README final
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md"
          message: "Terminer l'exercice 🎉"
          default_author: github_actions

  finish_issue:
    name: Féliciter et fermer l'Issue
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les templates français
        uses: actions/checkout@v4
        with:
          repository: ENSTASIMOV/exercise-toolkit-fr
          path: exercise-toolkit-fr
          ref: main

      - name: Construire le message final
        id: build-finish-message
        uses: skills/action-text-variables@v3
        with:
          template-file: exercise-toolkit-fr/markdown-templates/step-feedback/exercise-finished.md
          template-vars: |
            login: "${{ github.actor }}"
            repo_full_name: "${{ github.repository }}"
            readme_updated: "${{ inputs.update-readme-with-congratulations }}"

      - name: Publier le message final
        run: |
          gh issue comment "${{ inputs.issue-url }}" \
            --body "${{ steps.build-finish-message.outputs.updated-text }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fermer l'Issue
        run: gh issue close "${{ inputs.issue-url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
